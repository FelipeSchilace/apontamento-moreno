<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moreno Fundição — Painel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --bg-panel:#1a1a1a;
    --bg-elev:#232323;
    --border:#333333;
    --text:#f2f0ed;
    --text-dim:#9a9a9a;
    --red:#c62828;
    --red-dim:#7a1c1c;
    --amber:#e6a23c;
    --amber-dim:#8a6420;
    --green:#3f9142;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  header{
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .m{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:0.5px;}
  .brand .m span{color:var(--red);}
  .brand .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);margin-top:4px;text-transform:uppercase;}
  .header-direita{display:flex;align-items:center;gap:20px;}
  .op-tag{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);text-align:right;line-height:1.4;}
  .op-tag b{color:var(--text);font-size:14px;display:block;}
  .logout-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    font-family:var(--font-mono);font-size:11px;padding:8px 14px;border-radius:4px;letter-spacing:1px;
  }

  main{flex:1;display:flex;flex-direction:column;}
  .screen{display:none;flex-direction:column;flex:1;}
  .screen.active{display:flex;}

  /* ---------- LOGIN ---------- */
  #tela-login{align-items:center;justify-content:center;text-align:center;gap:24px;padding:20px;}
  .logo-grande{font-family:var(--font-display);font-weight:700;font-size:36px;letter-spacing:1px;}
  .logo-grande span{color:var(--red);}
  .login-hint{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-top:-14px;}
  .form-login{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;}
  .form-login input{
    width:100%;background:var(--bg-panel);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-body);font-size:15px;padding:14px;border-radius:8px;outline:none;
  }
  .form-login input:focus{border-color:var(--amber);}
  .btn-primario{
    background:var(--red);color:#fff;border:none;font-family:var(--font-body);font-weight:700;
    font-size:15px;letter-spacing:0.5px;padding:15px;border-radius:8px;
  }
  .btn-primario:active{background:var(--red-dim);}
  #login-erro{color:var(--red);font-family:var(--font-mono);font-size:12px;min-height:16px;}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:4px;padding:14px 28px 0;border-bottom:1px solid var(--border);}
  .tab-btn{
    background:none;border:none;color:var(--text-dim);font-family:var(--font-body);font-weight:600;
    font-size:14px;padding:12px 18px;border-bottom:2px solid transparent;
  }
  .tab-btn.active{color:var(--text);border-bottom-color:var(--red);}

  .conteudo{flex:1;padding:22px 28px 40px;}

  /* ---------- FILTROS ---------- */
  .filtros{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
  .filtros select{
    background:var(--bg-panel);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-body);font-size:13px;padding:10px 14px;border-radius:8px;outline:none;
  }
  .btn-atualizar{
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-mono);font-size:11px;letter-spacing:1px;padding:10px 16px;border-radius:8px;
    margin-left:auto;
  }
  .contagem{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:1px;}

  /* ---------- GRUPOS POR TIPO ---------- */
  .grupo-tipo{margin-bottom:32px;}
  .grupo-titulo{
    font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:0.5px;
    margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;
  }
  .grupo-titulo .qtd{
    font-family:var(--font-mono);font-size:11px;color:var(--text-dim);font-weight:400;
    background:var(--bg-elev);padding:2px 10px;border-radius:20px;
  }
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

  .card-op{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:16px;
  }
  .card-op .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .status-pill{
    font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;padding:5px 12px;
    border-radius:20px;text-transform:uppercase;border:1px solid var(--green);color:var(--green);
  }
  .status-pill.pausado{border-color:var(--amber);color:var(--amber);}
  .card-op .cronometro{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}
  .card-op .cronometro.pausado-txt{color:var(--amber);}
  .card-op .operador-nome{font-family:var(--font-body);font-weight:700;font-size:15px;margin-bottom:10px;}
  .card-op .linha{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .card-op .linha:last-of-type{border-bottom:none;margin-bottom:12px;}
  .card-op .linha span:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;}
  .card-op .linha span:last-child{font-weight:600;text-align:right;}
  .card-op .linha.pj span:last-child{color:var(--amber);}
  .acoes-card{display:flex;gap:8px;}
  .btn-pausar{
    flex:1;background:var(--bg-elev);border:1px solid var(--amber-dim);color:var(--amber);
    font-family:var(--font-body);font-weight:700;font-size:12px;padding:10px;border-radius:8px;
  }
  .btn-pausar.retomar{border-color:var(--green);color:var(--green);}
  .btn-encerrar{
    flex:1;background:var(--red);border:none;color:#fff;font-family:var(--font-body);
    font-weight:700;font-size:12px;padding:10px;border-radius:8px;
  }

  .vazio-geral{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 20px;text-align:center;color:var(--text-dim);
  }
  .vazio-geral p{font-family:var(--font-mono);font-size:12px;letter-spacing:0.5px;}

  /* ---------- OPERADORES ---------- */
  .lista-operadores{display:flex;flex-direction:column;gap:10px;}
  .card-operador{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;
    padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  }
  .card-operador .nome{font-weight:700;font-size:14px;}
  .card-operador .detalhe{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:3px;}
  .card-operador .qtd-badge{
    font-family:var(--font-mono);font-size:11px;background:var(--bg-elev);
    border:1px solid var(--border);padding:6px 12px;border-radius:20px;
  }

  /* ---------- MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
  .overlay.active{display:flex;}
  .modal{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:26px 22px;width:100%;max-width:340px;}
  .modal h3{font-family:var(--font-display);font-size:19px;margin-bottom:6px;}
  .modal p{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:20px;letter-spacing:0.5px;line-height:1.6;}
  .qtd-controle{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:22px;}
  .qtd-controle button{width:48px;height:48px;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);font-size:22px;border-radius:8px;}
  .qtd-controle input{width:90px;text-align:center;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:28px;padding:10px;border-radius:8px;}
  .modal-acoes{display:flex;gap:10px;}
  .modal-acoes button{flex:1;padding:14px;border-radius:8px;font-family:var(--font-body);font-weight:700;font-size:14px;}
  .btn-cancelar{background:none;border:1px solid var(--border);color:var(--text-dim);}
  .btn-confirmar{background:var(--red);border:none;color:#fff;}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(18,18,18,0.85);display:none;align-items:center;justify-content:center;z-index:20;
    font-family:var(--font-mono);color:var(--text-dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;
  }
  .loading-overlay.active{display:flex;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="m">MORENO<span>·</span>FUNDIÇÃO</div>
      <div class="sub">Painel Admin</div>
    </div>
    <div class="header-direita" id="header-admin" style="display:none;">
      <div class="op-tag"><b id="header-nome-admin"></b>Painel Administrativo</div>
      <button class="logout-btn" onclick="sair()">SAIR</button>
    </div>
  </header>

  <main>

    <!-- LOGIN -->
    <section id="tela-login" class="screen active">
      <div class="logo-grande">MORENO<span>·</span>FUNDIÇÃO</div>
      <div class="login-hint">Painel Administrativo</div>
      <form class="form-login" onsubmit="return false;">
        <input type="text" id="f-usuario" placeholder="Usuário" autocomplete="username">
        <input type="password" id="f-senha" placeholder="Senha" autocomplete="current-password">
        <button type="submit" class="btn-primario" onclick="entrarAdmin()">ENTRAR</button>
        <div id="login-erro"></div>
      </form>
    </section>

    <!-- PAINEL -->
    <section id="tela-painel" class="screen">
      <div class="tabs">
        <button class="tab-btn active" id="tab-operacoes" onclick="mudarAba('operacoes')">OPERAÇÕES ATIVAS</button>
        <button class="tab-btn" id="tab-operadores" onclick="mudarAba('operadores')">OPERADORES</button>
      </div>

      <div class="conteudo">

        <!-- ABA OPERAÇÕES -->
        <div id="aba-operacoes">
          <div class="filtros">
            <select id="filtro-setor" onchange="renderizarOperacoes()">
              <option value="">Todos os setores</option>
              <option value="Usinagem">Usinagem</option>
              <option value="Solda">Solda</option>
            </select>
            <select id="filtro-operador" onchange="renderizarOperacoes()">
              <option value="">Todos os operadores</option>
            </select>
            <span class="contagem" id="contagem-ativos"></span>
            <button class="btn-atualizar" onclick="carregarAtivos()">↻ ATUALIZAR</button>
          </div>
          <div id="grupos-operacoes"></div>
        </div>

        <!-- ABA OPERADORES -->
        <div id="aba-operadores" style="display:none;">
          <div class="lista-operadores" id="lista-operadores"></div>
        </div>

      </div>
    </section>

  </main>
</div>

<!-- MODAL ENCERRAR -->
<div class="overlay" id="overlay-encerrar">
  <div class="modal">
    <h3>Encerrar serviço</h3>
    <p id="texto-encerrar"></p>
    <div class="qtd-controle">
      <button onclick="alterarQtd(-1)">−</button>
      <input type="number" id="input-qtd" value="0" inputmode="numeric">
      <button onclick="alterarQtd(1)">+</button>
    </div>
    <div class="modal-acoes">
      <button class="btn-cancelar" onclick="fecharModalEncerrar()">CANCELAR</button>
      <button class="btn-confirmar" onclick="confirmarEncerrar()">CONFIRMAR</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">CARREGANDO...</div>

<script>
// ================== CONFIGURAÇÃO ==================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_5ffI5zZiIaNyOhFfRWVKsarDBAZYeO_xcb9ewe5Kjbb5-oHHqkY-cHuV7CVaDzwm/exec';
// ====================================================

// ---------- tabela de centros de trabalho (código -> descrição/tipo) ----------
const CENTROS = {
  '511084': ['SOLDA', 'Solda'],
  '511089': ['MONTAGEM / DESMONTAGEM', 'Montagem/Desmontagem'],
  '511091': ['GRAFITAMENTO', 'Grafitamento'],
  '511102': ['MANDRILHADORA MFZ 110 ZOCCA', 'Mandrilhadoras'],
  '511105': ['ARCO SUBMERSO DUPLO CABEÇOTE BAMBOZZI', 'Solda'],
  '511106': ['PLAINA DE MESA POREBA', 'Plainas'],
  '511112': ['FURADEIRA RADIAL HCP', 'Furadeiras'],
  '511113': ['FURADEIRA RADIAL CSEPEL HUNGARY 264', 'Furadeiras'],
  '511114': ['FURADEIRA RADIAL ROCCO', 'Furadeiras'],
  '511115': ['FURADEIRA RADIAL', 'Furadeiras'],
  '511117': ['TORNO FICHER TP 3000', 'Tornos'],
  '511118': ['TORNO FICHER TP 4000', 'Tornos'],
  '511119': ['TORNO NARDINI AM-600-C', 'Tornos'],
  '511120': ['TORNO TONANI TP-90', 'Tornos'],
  '511121': ['TORNO TOS SKJ-85', 'Tornos'],
  '511122': ['TORNO ROMI S-30', 'Tornos'],
  '511123': ['TORNO VERTICAL LOUIS SOEST DUSSEL', 'Tornos'],
  '511124': ['TORNO VERTICAL WEBSTER BENNETT', 'Tornos'],
  '511125': ['FURADEIRA RADIAL VR8', 'Furadeiras'],
  '511151': ['MANDRILHADORA FISCHER', 'Mandrilhadoras'],
  '521210': ['MANDRILHADORA SCHIESS A.G. FB 28/16', 'Mandrilhadoras'],
  '521284': ['MANDRILHADORA WOTAN', 'Mandrilhadoras'],
  '521285': ['TORNO VERTICAL TITAN SC-4000', 'Tornos'],
  '521327': ['MANDRILHADORA SKODA 3500 X 4500', 'Mandrilhadoras'],
  '521328': ['TORNO POREBA 1600 X 6000', 'Tornos'],
  '521374': ['PLAINA WALDRICH', 'Plainas'],
  '521393': ['TORNO POREBA', 'Tornos'],
  '511394': ['TORNO HORIZONTAL TOS SU-125', 'Tornos'],
  '521395': ['TORNO VERTICAL SCHIESS KZ-200', 'Tornos'],
  '521396': ['TORNO VERTICAL TITAN SC-27', 'Tornos'],
  '521433': ['MANDRILHADORA SCHARMAN', 'Mandrilhadoras'],
  '521459': ['FRESADORA TOZ KURIN', 'Fresadoras'],
  '521472': ['MANDRILHADORA TOS WHN(Q)', 'Mandrilhadoras'],
  '521493': ['MANDRILHADORA TOS WHN(Q)', 'Mandrilhadoras'],
  '521496': ['TORNO VERTICAL SCHIESS Ø8000 - TVG', 'Tornos'],
  '521505': ['TORNO HORIZONTAL POREBA', 'Tornos'],
  '521544': ['CELULA DE SOLDA P/ CAMISA - CHAPISCO', 'Solda'],
  '521545': ['CELULA DE SOLDA P/ CAMISA - PICOTE', 'Solda'],
  '521560': ['FRESADORA VERTICAL DROPP HEINN UMG', 'Fresadoras'],
  '521561': ['TORNO HORIZONTAL NILES DXP 6.3 X 8', 'Tornos'],
  '521571': ['CELULA DE SOLDA P/ CAMISA - BASE / SOBRE', 'Solda'],
  '521572': ['CELULA DE SOLDA P/ CAMISA - LATERAL', 'Solda'],
  '521610': ['FRESADORA HEYLIGENTASDE', 'Fresadoras'],
  '521611': ['TORNO H. KRAMATORSKY', 'Tornos'],
  '521613': ['FURADEIRA RADIAL', 'Furadeiras']
};
const SETORES_SOLDA = ['Solda'];
function tipoDoCententro(codigo){
  const info = CENTROS[String(codigo).trim()];
  return info ? info[1] : 'Outros';
}
function nomeDoCentro(codigo){
  const info = CENTROS[String(codigo).trim()];
  return info ? info[0] : null;
}
function setorDoTipo(tipo){
  return SETORES_SOLDA.includes(tipo) ? 'Solda' : 'Usinagem';
}
const ORDEM_TIPOS = ['Tornos','Mandrilhadoras','Furadeiras','Fresadoras','Plainas','Solda','Montagem/Desmontagem','Grafitamento','Outros'];

// ---------- estado ----------
let admin = null; // { usuario, nome }
let todosAtivos = [];
let timerInterval = null;
let encerrarIdAtual = null;
let qtdAtual = 0;

// ---------- utilidades ----------
function loading(mostrar){
  document.getElementById('loading').classList.toggle('active', mostrar);
}
async function chamarAPI(params, method, body){
  const url = APPS_SCRIPT_URL + (params ? '?' + params : '');
  const opts = method === 'POST' ? { method:'POST', body: JSON.stringify(body) } : {};
  const resp = await fetch(url, opts);
  return await resp.json();
}
function escaparHtml(v){
  const d = document.createElement('div');
  d.textContent = v == null ? '' : String(v);
  return d.innerHTML;
}

// ---------- login ----------
async function entrarAdmin(){
  const erroEl = document.getElementById('login-erro');
  erroEl.textContent = '';
  const usuario = document.getElementById('f-usuario').value.trim();
  const senha = document.getElementById('f-senha').value;
  if(!usuario || !senha){ erroEl.textContent = 'Preencha usuário e senha'; return; }
  loading(true);
  try{
    const r = await chamarAPI(null, 'POST', { action:'loginAdmin', usuario, senha });
    if(!r.ok){ erroEl.textContent = r.erro || 'Usuário ou senha inválidos'; loading(false); return; }
    admin = { usuario, nome: r.nome };
    document.getElementById('header-nome-admin').textContent = r.nome;
    document.getElementById('header-admin').style.display = 'flex';
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('tela-painel').classList.add('active');
    await carregarAtivos();
    timerInterval = setInterval(atualizarCronometros, 1000);
  }catch(err){
    erroEl.textContent = 'Erro de conexão. Tente novamente.';
  }
  loading(false);
}
function sair(){
  admin = null;
  todosAtivos = [];
  clearInterval(timerInterval);
  document.getElementById('f-usuario').value = '';
  document.getElementById('f-senha').value = '';
  document.getElementById('login-erro').textContent = '';
  document.getElementById('header-admin').style.display = 'none';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('tela-login').classList.add('active');
}

// ---------- abas ----------
function mudarAba(nome){
  document.getElementById('tab-operacoes').classList.toggle('active', nome==='operacoes');
  document.getElementById('tab-operadores').classList.toggle('active', nome==='operadores');
  document.getElementById('aba-operacoes').style.display = nome==='operacoes' ? 'block' : 'none';
  document.getElementById('aba-operadores').style.display = nome==='operadores' ? 'block' : 'none';
  if(nome==='operadores') renderizarOperadores();
}

// ---------- carregar dados ----------
async function carregarAtivos(){
  loading(true);
  try{
    const r = await chamarAPI('action=ativosTodos');
    todosAtivos = (r.ok && Array.isArray(r.dados)) ? r.dados : [];
    popularFiltroOperadores();
    renderizarOperacoes();
    if(document.getElementById('aba-operadores').style.display !== 'none') renderizarOperadores();
  }catch(err){
    alert('Erro ao carregar operações. Tente novamente.');
  }
  loading(false);
}
function popularFiltroOperadores(){
  const select = document.getElementById('filtro-operador');
  const atual = select.value;
  const nomes = [...new Set(todosAtivos.map(a => a.nome))].sort();
  select.innerHTML = '<option value="">Todos os operadores</option>' +
    nomes.map(n => `<option value="${escaparHtml(n)}">${escaparHtml(n)}</option>`).join('');
  select.value = atual;
}

// ---------- render operações agrupadas por tipo ----------
function renderizarOperacoes(){
  const setor = document.getElementById('filtro-setor').value;
  const operador = document.getElementById('filtro-operador').value;

  let lista = todosAtivos.map(a => ({ ...a, tipo: tipoDoCententro(a.centro) }));
  if(setor) lista = lista.filter(a => setorDoTipo(a.tipo) === setor);
  if(operador) lista = lista.filter(a => a.nome === operador);

  document.getElementById('contagem-ativos').textContent = lista.length + ' ativa(s)';

  const container = document.getElementById('grupos-operacoes');
  if(lista.length === 0){
    container.innerHTML = '<div class="vazio-geral"><p>Nenhuma operação ativa no momento</p></div>';
    return;
  }

  const grupos = {};
  lista.forEach(a => {
    if(!grupos[a.tipo]) grupos[a.tipo] = [];
    grupos[a.tipo].push(a);
  });

  const tiposOrdenados = Object.keys(grupos).sort((x,y) => ORDEM_TIPOS.indexOf(x) - ORDEM_TIPOS.indexOf(y));

  container.innerHTML = tiposOrdenados.map(tipo => `
    <div class="grupo-tipo">
      <div class="grupo-titulo">${tipo} <span class="qtd">${grupos[tipo].length}</span></div>
      <div class="grid-cards">
        ${grupos[tipo].map(a => cardOperacao(a)).join('')}
      </div>
    </div>
  `).join('');

  atualizarCronometros();
}
function cardOperacao(a){
  const nomeCentro = nomeDoCentro(a.centro);
  return `
    <div class="card-op" data-id="${a.id}">
      <div class="topo">
        <span class="status-pill ${a.status==='PAUSADO'?'pausado':''}">${a.status==='PAUSADO'?'PAUSADO':'EM ANDAMENTO'}</span>
        <span class="cronometro ${a.status==='PAUSADO'?'pausado-txt':''}" id="crono-${a.id}">00:00:00</span>
      </div>
      <div class="operador-nome">${escaparHtml(a.nome)}</div>
      <div class="linha"><span>Ordem</span><span>${escaparHtml(a.ordem)}</span></div>
      <div class="linha"><span>Operação</span><span>${escaparHtml(a.op)}</span></div>
      <div class="linha pj"><span>PJ</span><span>${escaparHtml(a.pj)}</span></div>
      <div class="linha"><span>Centro</span><span title="${nomeCentro?escaparHtml(nomeCentro):''}">${escaparHtml(a.centro)}${nomeCentro ? ' — '+escaparHtml(nomeCentro) : ''}</span></div>
      <div class="acoes-card">
        <button class="btn-pausar ${a.status==='PAUSADO'?'retomar':''}" onclick="alternarPausa('${a.id}')">${a.status==='PAUSADO'?'RETOMAR':'PAUSAR'}</button>
        <button class="btn-encerrar" onclick="abrirModalEncerrar('${a.id}','${escaparHtml(a.nome)}','${escaparHtml(a.ordem)}')">ENCERRAR</button>
      </div>
    </div>
  `;
}
function atualizarCronometros(){
  todosAtivos.forEach(a => {
    const el = document.getElementById('crono-' + a.id);
    if(!el) return;
    const agora = Date.now();
    let decorridoMs;
    if(a.status === 'PAUSADO' && a.pausadoTs){
      decorridoMs = a.pausadoTs - a.inicioTs - (a.pausaMin*60000);
    } else {
      decorridoMs = agora - a.inicioTs - (a.pausaMin*60000);
    }
    decorridoMs = Math.max(0, decorridoMs);
    const totalSeg = Math.floor(decorridoMs/1000);
    const h = String(Math.floor(totalSeg/3600)).padStart(2,'0');
    const m = String(Math.floor((totalSeg%3600)/60)).padStart(2,'0');
    const s = String(totalSeg%60).padStart(2,'0');
    el.textContent = h+':'+m+':'+s;
  });
}

// ---------- render operadores ----------
function renderizarOperadores(){
  const porOperador = {};
  todosAtivos.forEach(a => {
    if(!porOperador[a.nome]) porOperador[a.nome] = [];
    porOperador[a.nome].push(a);
  });
  const nomes = Object.keys(porOperador).sort();
  const container = document.getElementById('lista-operadores');
  if(nomes.length === 0){
    container.innerHTML = '<div class="vazio-geral"><p>Nenhum operador apontando no momento</p></div>';
    return;
  }
  container.innerHTML = nomes.map(nome => {
    const ativos = porOperador[nome];
    const ordens = ativos.map(a => 'Ordem ' + a.ordem + ' (PJ ' + a.pj + ')').join(' · ');
    return `
      <div class="card-operador">
        <div>
          <div class="nome">${escaparHtml(nome)}</div>
          <div class="detalhe">${escaparHtml(ordens)}</div>
        </div>
        <div class="qtd-badge">${ativos.length} ativo(s)</div>
      </div>
    `;
  }).join('');
}

// ---------- ações: pausar / retomar ----------
async function alternarPausa(id){
  const a = todosAtivos.find(x => x.id === id);
  if(!a) return;
  loading(true);
  try{
    if(a.status === 'EM ANDAMENTO'){
      const r = await chamarAPI(null,'POST',{action:'pausar', id});
      if(!r.ok) throw new Error(r.erro);
      a.status = 'PAUSADO';
      a.pausadoTs = r.dados.pausadoTs;
    } else {
      const r = await chamarAPI(null,'POST',{action:'retomar', id});
      if(!r.ok) throw new Error(r.erro);
      a.status = 'EM ANDAMENTO';
      a.pausaMin = r.dados.pausaMin;
      a.pausadoTs = null;
    }
    renderizarOperacoes();
  }catch(err){
    alert('Erro ao atualizar. Tente novamente.');
  }
  loading(false);
}

// ---------- encerrar ----------
function abrirModalEncerrar(id, nome, ordem){
  encerrarIdAtual = id;
  qtdAtual = 0;
  document.getElementById('input-qtd').value = 0;
  document.getElementById('texto-encerrar').textContent = nome + ' — Ordem ' + ordem + '. Quantas peças foram produzidas?';
  document.getElementById('overlay-encerrar').classList.add('active');
}
function fecharModalEncerrar(){
  document.getElementById('overlay-encerrar').classList.remove('active');
  encerrarIdAtual = null;
}
function alterarQtd(delta){
  qtdAtual = Math.max(0, qtdAtual + delta);
  document.getElementById('input-qtd').value = qtdAtual;
}
document.getElementById('input-qtd').addEventListener('input', function(){
  qtdAtual = Math.max(0, parseInt(this.value)||0);
});
async function confirmarEncerrar(){
  if(!encerrarIdAtual) return;
  loading(true);
  try{
    const r = await chamarAPI(null,'POST',{action:'encerrar', id:encerrarIdAtual, quantidade:qtdAtual});
    if(!r.ok) throw new Error(r.erro);
    todosAtivos = todosAtivos.filter(a => a.id !== encerrarIdAtual);
    fecharModalEncerrar();
    popularFiltroOperadores();
    renderizarOperacoes();
    renderizarOperadores();
  }catch(err){
    alert('Erro ao encerrar. Tente novamente.');
  }
  loading(false);
}
</script>
</body>
