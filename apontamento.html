<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moreno Fundição — Apontamento</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apontamento">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --bg-panel:#1a1a1a;
    --bg-elev:#232323;
    --border:#333333;
    --text:#f2f0ed;
    --text-dim:#9a9a9a;
    --red:#c62828;
    --red-dim:#7a1c1c;
    --amber:#e6a23c;
    --amber-dim:#8a6420;
    --green:#3f9142;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    position:relative;
  }
  header{
    padding:22px 20px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1;
  }
  .brand .m{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:0.5px;
    color:var(--text);
  }
  .brand .m span{color:var(--red);}
  .brand .sub{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:2px;
    color:var(--text-dim);
    margin-top:4px;
    text-transform:uppercase;
  }
  .op-tag{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:right;
    line-height:1.4;
  }
  .op-tag b{color:var(--text);font-size:14px;display:block;}
  .logout-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    font-family:var(--font-mono);font-size:11px;padding:6px 10px;border-radius:4px;
    margin-top:6px;letter-spacing:1px;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px 40px;
  }
  .screen{display:none;flex-direction:column;flex:1;}
  .screen.active{display:flex;}

  /* ---------- LOGIN ---------- */
  #tela-login{align-items:center;justify-content:center;text-align:center;gap:28px;}
  .logo-grande{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    letter-spacing:1px;
  }
  .logo-grande span{color:var(--red);}
  .login-hint{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-top:-16px;
  }
  #cracha-display{
    width:100%;
    max-width:280px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    font-family:var(--font-mono);
    font-size:32px;
    letter-spacing:8px;
    text-align:center;
    color:var(--text);
    min-height:66px;
  }
  #cracha-display.vazio{color:var(--text-dim);letter-spacing:2px;font-size:16px;}
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    width:100%;
    max-width:280px;
  }
  .keypad button{
    background:var(--bg-elev);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:22px;
    font-weight:600;
    padding:16px 0;
    border-radius:8px;
    transition:background .1s;
  }
  .keypad button:active{background:var(--bg-panel);}
  .keypad button.apagar{color:var(--amber);font-size:14px;font-family:var(--font-body);font-weight:600;}
  .keypad button.entrar{background:var(--red-dim);border-color:var(--red);color:#fff;font-size:14px;font-family:var(--font-body);font-weight:700;letter-spacing:1px;}
  .keypad button:disabled{opacity:0.35;}
  #login-erro{
    color:var(--red);
    font-family:var(--font-mono);
    font-size:12px;
    min-height:16px;
  }

  /* ---------- FORM NOVO APONTAMENTO ---------- */
  .titulo-tela{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    letter-spacing:0.5px;
    margin-bottom:4px;
  }
  .subtitulo-tela{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:26px;
  }
  .campo{margin-bottom:18px;}
  .campo label{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .campo input, .campo textarea{
    width:100%;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px;
    padding:14px;
    border-radius:8px;
    outline:none;
  }
  .campo input:focus, .campo textarea:focus{border-color:var(--amber);}
  .campo textarea{resize:none;min-height:60px;}
  .campo.pj-1301 input{border-color:var(--amber);color:var(--amber);font-weight:600;}
  .aviso-pj{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--amber);
    margin-top:6px;
    letter-spacing:0.5px;
  }
  .btn-primario{
    background:var(--red);
    color:#fff;
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    font-size:16px;
    letter-spacing:0.5px;
    padding:17px;
    border-radius:8px;
    margin-top:8px;
  }
  .btn-primario:active{background:var(--red-dim);}
  .btn-primario:disabled{background:var(--bg-elev);color:var(--text-dim);}
  .erro-form{
    color:var(--red);
    font-family:var(--font-mono);
    font-size:12px;
    margin-top:10px;
    text-align:center;
    min-height:16px;
  }

  /* ---------- ATIVO ---------- */
  #tela-ativo{align-items:center;text-align:center;justify-content:flex-start;gap:0;}
  .status-pill{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    padding:6px 14px;
    border-radius:20px;
    text-transform:uppercase;
    margin-top:10px;
    border:1px solid var(--green);
    color:var(--green);
  }
  .status-pill.pausado{border-color:var(--amber);color:var(--amber);}
  #cronometro{
    font-family:var(--font-mono);
    font-size:58px;
    font-weight:600;
    margin:22px 0 4px;
    letter-spacing:2px;
    font-variant-numeric:tabular-nums;
  }
  #cronometro.pausado-txt{color:var(--amber);}
  .cronometro-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:2px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:30px;
  }
  .card-info{
    width:100%;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 18px;
    text-align:left;
    margin-bottom:28px;
  }
  .card-info .linha{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .card-info .linha:last-child{border-bottom:none;}
  .card-info .linha span:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .card-info .linha span:last-child{font-weight:600;text-align:right;}
  .card-info .linha.pj span:last-child{color:var(--amber);}
  .acoes-ativo{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:auto;}
  .btn-pausar{
    background:var(--bg-elev);
    border:1px solid var(--amber-dim);
    color:var(--amber);
    font-family:var(--font-body);
    font-weight:700;
    font-size:16px;
    padding:16px;
    border-radius:8px;
  }
  .btn-pausar.retomar{border-color:var(--green);color:var(--green);}
  .btn-encerrar{
    background:var(--red);
    border:none;
    color:#fff;
    font-family:var(--font-body);
    font-weight:700;
    font-size:16px;
    padding:16px;
    border-radius:8px;
  }

  /* ---------- MODAL ENCERRAR ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .overlay.active{display:flex;}
  .modal{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:26px 22px;
    width:100%;
    max-width:340px;
  }
  .modal h3{
    font-family:var(--font-display);
    font-size:19px;
    margin-bottom:6px;
  }
  .modal p{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:20px;
    letter-spacing:0.5px;
  }
  .qtd-controle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:22px;
  }
  .qtd-controle button{
    width:48px;height:48px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    color:var(--text);
    font-size:22px;
    border-radius:8px;
  }
  .qtd-controle input{
    width:90px;
    text-align:center;
    background:var(--bg-elev);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:28px;
    padding:10px;
    border-radius:8px;
  }
  .modal-acoes{display:flex;gap:10px;}
  .modal-acoes button{flex:1;padding:14px;border-radius:8px;font-family:var(--font-body);font-weight:700;font-size:14px;}
  .btn-cancelar{background:none;border:1px solid var(--border);color:var(--text-dim);}
  .btn-confirmar{background:var(--red);border:none;color:#fff;}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(18,18,18,0.85);
    display:none;align-items:center;justify-content:center;z-index:20;
    font-family:var(--font-mono);color:var(--text-dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;
  }
  .loading-overlay.active{display:flex;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="m">MORENO<span>·</span>FUNDIÇÃO</div>
      <div class="sub">Apontamento</div>
    </div>
    <div id="header-op" style="display:none;">
      <div class="op-tag"><b id="header-nome"></b>Crachá <span id="header-cracha"></span></div>
      <button class="logout-btn" onclick="sair()">SAIR</button>
    </div>
  </header>

  <main>

    <!-- LOGIN -->
    <section id="tela-login" class="screen active">
      <div class="logo-grande">MORENO<span>·</span>FUNDIÇÃO</div>
      <div class="login-hint">Informe seu crachá</div>
      <div id="cracha-display" class="vazio">— — — —</div>
      <div class="keypad">
        <button onclick="digitar('1')">1</button>
        <button onclick="digitar('2')">2</button>
        <button onclick="digitar('3')">3</button>
        <button onclick="digitar('4')">4</button>
        <button onclick="digitar('5')">5</button>
        <button onclick="digitar('6')">6</button>
        <button onclick="digitar('7')">7</button>
        <button onclick="digitar('8')">8</button>
        <button onclick="digitar('9')">9</button>
        <button class="apagar" onclick="apagar()">APAGAR</button>
        <button onclick="digitar('0')">0</button>
        <button class="entrar" onclick="entrar()">ENTRAR</button>
      </div>
      <div id="login-erro"></div>
    </section>

    <!-- NOVO APONTAMENTO -->
    <section id="tela-novo" class="screen">
      <div class="titulo-tela">Novo apontamento</div>
      <div class="subtitulo-tela">Preencha os dados do serviço</div>

      <div class="campo">
        <label>Ordem</label>
        <input type="text" id="f-ordem" inputmode="numeric" placeholder="Nº da ordem">
      </div>
      <div class="campo">
        <label>Operação (OP)</label>
        <input type="text" id="f-op" placeholder="Ex: Torneamento">
      </div>
      <div class="campo" id="campo-pj">
        <label>PJ</label>
        <input type="text" id="f-pj" inputmode="numeric" placeholder="Nº do PJ">
        <div class="aviso-pj" id="aviso-pj" style="display:none;">⚠ Este PJ segue para aprovação</div>
      </div>
      <div class="campo">
        <label>Centro de Trabalho</label>
        <input type="text" id="f-centro" placeholder="Ex: Usinagem 1">
      </div>
      <div class="campo">
        <label>Observação (opcional)</label>
        <textarea id="f-obs" placeholder="Alguma observação sobre o serviço"></textarea>
      </div>

      <button class="btn-primario" onclick="iniciarApontamento()">INICIAR APONTAMENTO</button>
      <div class="erro-form" id="erro-novo"></div>
    </section>

    <!-- ATIVO -->
    <section id="tela-ativo" class="screen">
      <div class="status-pill" id="status-pill">EM ANDAMENTO</div>
      <div id="cronometro">00:00:00</div>
      <div class="cronometro-label">Tempo de serviço</div>

      <div class="card-info">
        <div class="linha"><span>Ordem</span><span id="info-ordem">—</span></div>
        <div class="linha"><span>Operação</span><span id="info-op">—</span></div>
        <div class="linha pj"><span>PJ</span><span id="info-pj">—</span></div>
        <div class="linha"><span>Centro</span><span id="info-centro">—</span></div>
      </div>

      <div class="acoes-ativo">
        <button class="btn-pausar" id="btn-pausar" onclick="alternarPausa()">PAUSAR</button>
        <button class="btn-encerrar" onclick="abrirModalEncerrar()">ENCERRAR SERVIÇO</button>
      </div>
    </section>

  </main>
</div>

<!-- MODAL ENCERRAR -->
<div class="overlay" id="overlay-encerrar">
  <div class="modal">
    <h3>Encerrar serviço</h3>
    <p>Quantas peças foram produzidas?</p>
    <div class="qtd-controle">
      <button onclick="alterarQtd(-1)">−</button>
      <input type="number" id="input-qtd" value="0" inputmode="numeric">
      <button onclick="alterarQtd(1)">+</button>
    </div>
    <div class="modal-acoes">
      <button class="btn-cancelar" onclick="fecharModalEncerrar()">CANCELAR</button>
      <button class="btn-confirmar" onclick="confirmarEncerrar()">CONFIRMAR</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading">ENVIANDO...</div>

<script>
// ================== CONFIGURAÇÃO ==================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_5ffI5zZiIaNyOhFfRWVKsarDBAZYeO_xcb9ewe5Kjbb5-oHHqkY-cHuV7CVaDzwm/exec';
// ====================================================

let operadores = [];
let crachaDigitado = '';
let sessao = null;      // { nome, cracha }
let apontamentoAtivo = null; // { id, inicioTs, pausaMin, pausadoTs, status, ordem, op, pj, centro }
let timerInterval = null;

// ---------- utilidades ----------
function mostrarTela(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function loading(mostrar){
  document.getElementById('loading').classList.toggle('active', mostrar);
}
async function chamarAPI(params, method, body){
  const url = APPS_SCRIPT_URL + (params ? '?' + params : '');
  const opts = method === 'POST'
    ? { method:'POST', body: JSON.stringify(body) }
    : {};
  const resp = await fetch(url, opts);
  return await resp.json();
}

// ---------- login ----------
function digitar(n){
  if(crachaDigitado.length >= 6) return;
  crachaDigitado += n;
  atualizarDisplayCracha();
}
function apagar(){
  crachaDigitado = crachaDigitado.slice(0,-1);
  atualizarDisplayCracha();
}
function atualizarDisplayCracha(){
  const el = document.getElementById('cracha-display');
  if(crachaDigitado.length === 0){
    el.textContent = '— — — —';
    el.classList.add('vazio');
  } else {
    el.textContent = crachaDigitado;
    el.classList.remove('vazio');
  }
}
async function entrar(){
  const erroEl = document.getElementById('login-erro');
  erroEl.textContent = '';
  if(!crachaDigitado){ erroEl.textContent = 'Digite seu crachá'; return; }
  loading(true);
  try{
    if(operadores.length === 0){
      const r = await chamarAPI('action=operadores');
      if(!r.ok) throw new Error(r.erro || 'Falha ao carregar operadores');
      operadores = r.dados;
    }
    const op = operadores.find(o => o.cracha === crachaDigitado);
    if(!op){ erroEl.textContent = 'Crachá não encontrado'; loading(false); return; }
    sessao = op;
    document.getElementById('header-nome').textContent = op.nome;
    document.getElementById('header-cracha').textContent = op.cracha;
    document.getElementById('header-op').style.display = 'block';

    const ativoResp = await chamarAPI('action=ativo&cracha=' + encodeURIComponent(op.cracha));
    if(ativoResp.ok && ativoResp.dados){
      apontamentoAtivo = ativoResp.dados;
      abrirTelaAtivo();
    } else {
      mostrarTela('tela-novo');
    }
  }catch(err){
    erroEl.textContent = 'Erro de conexão. Tente novamente.';
  }
  loading(false);
}
function sair(){
  sessao = null;
  crachaDigitado = '';
  apontamentoAtivo = null;
  clearInterval(timerInterval);
  atualizarDisplayCracha();
  document.getElementById('header-op').style.display = 'none';
  document.getElementById('login-erro').textContent = '';
  mostrarTela('tela-login');
}

// ---------- alerta visual PJ 1301 ----------
document.getElementById('f-pj').addEventListener('input', function(){
  const aviso = document.getElementById('aviso-pj');
  const campo = document.getElementById('campo-pj');
  if(this.value.trim() === '1301'){
    aviso.style.display = 'block';
    campo.classList.add('pj-1301');
  } else {
    aviso.style.display = 'none';
    campo.classList.remove('pj-1301');
  }
});

// ---------- novo apontamento ----------
async function iniciarApontamento(){
  const erroEl = document.getElementById('erro-novo');
  erroEl.textContent = '';
  const ordem = document.getElementById('f-ordem').value.trim();
  const op = document.getElementById('f-op').value.trim();
  const pj = document.getElementById('f-pj').value.trim();
  const centro = document.getElementById('f-centro').value.trim();
  const obs = document.getElementById('f-obs').value.trim();

  if(!ordem || !op || !pj || !centro){
    erroEl.textContent = 'Preencha Ordem, Operação, PJ e Centro de Trabalho';
    return;
  }
  loading(true);
  try{
    const r = await chamarAPI(null, 'POST', {
      action:'iniciar', cracha:sessao.cracha, nome:sessao.nome,
      ordem, op, pj, centro, observacao: obs
    });
    if(!r.ok) throw new Error(r.erro);
    apontamentoAtivo = {
      id:r.dados.id, inicioTs:r.dados.inicioTs, pausaMin:0, pausadoTs:null,
      status:'EM ANDAMENTO', ordem, op, pj, centro
    };
    ['f-ordem','f-op','f-pj','f-centro','f-obs'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('aviso-pj').style.display='none';
    document.getElementById('campo-pj').classList.remove('pj-1301');
    abrirTelaAtivo();
  }catch(err){
    erroEl.textContent = 'Erro ao enviar. Tente novamente.';
  }
  loading(false);
}

// ---------- tela ativo / cronômetro ----------
function abrirTelaAtivo(){
  document.getElementById('info-ordem').textContent = apontamentoAtivo.ordem;
  document.getElementById('info-op').textContent = apontamentoAtivo.op;
  document.getElementById('info-pj').textContent = apontamentoAtivo.pj;
  document.getElementById('info-centro').textContent = apontamentoAtivo.centro;
  atualizarStatusVisual();
  mostrarTela('tela-ativo');
  clearInterval(timerInterval);
  timerInterval = setInterval(atualizarCronometro, 1000);
  atualizarCronometro();
}
function atualizarStatusVisual(){
  const pill = document.getElementById('status-pill');
  const btnPausar = document.getElementById('btn-pausar');
  const crono = document.getElementById('cronometro');
  if(apontamentoAtivo.status === 'PAUSADO'){
    pill.textContent = 'PAUSADO';
    pill.classList.add('pausado');
    btnPausar.textContent = 'RETOMAR';
    btnPausar.classList.add('retomar');
    crono.classList.add('pausado-txt');
  } else {
    pill.textContent = 'EM ANDAMENTO';
    pill.classList.remove('pausado');
    btnPausar.textContent = 'PAUSAR';
    btnPausar.classList.remove('retomar');
    crono.classList.remove('pausado-txt');
  }
}
function atualizarCronometro(){
  if(!apontamentoAtivo) return;
  const agora = Date.now();
  let decorridoMs;
  if(apontamentoAtivo.status === 'PAUSADO' && apontamentoAtivo.pausadoTs){
    decorridoMs = apontamentoAtivo.pausadoTs - apontamentoAtivo.inicioTs - (apontamentoAtivo.pausaMin*60000);
  } else {
    decorridoMs = agora - apontamentoAtivo.inicioTs - (apontamentoAtivo.pausaMin*60000);
  }
  decorridoMs = Math.max(0, decorridoMs);
  const totalSeg = Math.floor(decorridoMs/1000);
  const h = String(Math.floor(totalSeg/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSeg%3600)/60)).padStart(2,'0');
  const s = String(totalSeg%60).padStart(2,'0');
  document.getElementById('cronometro').textContent = h+':'+m+':'+s;
}

async function alternarPausa(){
  loading(true);
  try{
    if(apontamentoAtivo.status === 'EM ANDAMENTO'){
      const r = await chamarAPI(null,'POST',{action:'pausar', id:apontamentoAtivo.id});
      if(!r.ok) throw new Error(r.erro);
      apontamentoAtivo.status = 'PAUSADO';
      apontamentoAtivo.pausadoTs = r.dados.pausadoTs;
    } else {
      const r = await chamarAPI(null,'POST',{action:'retomar', id:apontamentoAtivo.id});
      if(!r.ok) throw new Error(r.erro);
      apontamentoAtivo.status = 'EM ANDAMENTO';
      apontamentoAtivo.pausaMin = r.dados.pausaMin;
      apontamentoAtivo.pausadoTs = null;
    }
    atualizarStatusVisual();
    atualizarCronometro();
  }catch(err){
    alert('Erro ao atualizar. Tente novamente.');
  }
  loading(false);
}

// ---------- encerrar ----------
let qtdAtual = 0;
function abrirModalEncerrar(){
  qtdAtual = 0;
  document.getElementById('input-qtd').value = 0;
  document.getElementById('overlay-encerrar').classList.add('active');
}
function fecharModalEncerrar(){
  document.getElementById('overlay-encerrar').classList.remove('active');
}
function alterarQtd(delta){
  qtdAtual = Math.max(0, qtdAtual + delta);
  document.getElementById('input-qtd').value = qtdAtual;
}
document.getElementById('input-qtd').addEventListener('input', function(){
  qtdAtual = Math.max(0, parseInt(this.value)||0);
});
async function confirmarEncerrar(){
  loading(true);
  try{
    const r = await chamarAPI(null,'POST',{action:'encerrar', id:apontamentoAtivo.id, quantidade:qtdAtual});
    if(!r.ok) throw new Error(r.erro);
    fecharModalEncerrar();
    clearInterval(timerInterval);
    apontamentoAtivo = null;
    mostrarTela('tela-novo');
  }catch(err){
    alert('Erro ao encerrar. Tente novamente.');
  }
  loading(false);
}

// ---------- PWA: registra o service worker ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
