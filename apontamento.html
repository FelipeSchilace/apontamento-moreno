<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moreno Fundição — Apontamento</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apontamento">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --bg-panel:#1a1a1a;
    --bg-elev:#232323;
    --border:#333333;
    --text:#f2f0ed;
    --text-dim:#9a9a9a;
    --red:#c62828;
    --red-dim:#7a1c1c;
    --amber:#e6a23c;
    --amber-dim:#8a6420;
    --green:#3f9142;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    position:relative;
  }
  header{
    padding:22px 20px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1;
  }
  .brand .m{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:0.5px;
    color:var(--text);
  }
  .brand .m span{color:var(--red);}
  .brand .sub{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:2px;
    color:var(--text-dim);
    margin-top:4px;
    text-transform:uppercase;
  }
  .op-tag{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:right;
    line-height:1.4;
  }
  .op-tag b{color:var(--text);font-size:14px;display:block;}
  .header-botoes{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .logout-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    font-family:var(--font-mono);font-size:10px;padding:6px 9px;border-radius:4px;
    letter-spacing:0.5px;white-space:nowrap;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px 40px;
  }
  .screen{display:none;flex-direction:column;flex:1;}
  .screen.active{display:flex;}

  /* ---------- LOGIN ---------- */
  #tela-login{align-items:center;justify-content:center;text-align:center;gap:28px;}
  .logo-grande{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    letter-spacing:1px;
  }
  .logo-grande span{color:var(--red);}
  .login-hint{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-top:-16px;
  }
  #cracha-display{
    width:100%;
    max-width:280px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    font-family:var(--font-mono);
    font-size:32px;
    letter-spacing:8px;
    text-align:center;
    color:var(--text);
    min-height:66px;
  }
  #cracha-display.vazio{color:var(--text-dim);letter-spacing:2px;font-size:16px;}
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    width:100%;
    max-width:280px;
  }
  .keypad button{
    background:var(--bg-elev);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:22px;
    font-weight:600;
    padding:16px 0;
    border-radius:8px;
    transition:background .1s;
  }
  .keypad button:active{background:var(--bg-panel);}
  .keypad button.apagar{color:var(--amber);font-size:14px;font-family:var(--font-body);font-weight:600;}
  .keypad button.entrar{background:var(--red-dim);border-color:var(--red);color:#fff;font-size:14px;font-family:var(--font-body);font-weight:700;letter-spacing:1px;}
  .keypad button:disabled{opacity:0.35;}
  #login-erro{
    color:var(--red);
    font-family:var(--font-mono);
    font-size:12px;
    min-height:16px;
  }
  .lembrar-linha{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
  .lembrar-linha input{width:16px;height:16px;accent-color:var(--red);}
  .entrando-auto{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:1px;
  }

  /* ---------- FORM NOVO APONTAMENTO ---------- */
  .topo-tela{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .titulo-tela{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .link-voltar{
    background:none;border:none;color:var(--text-dim);
    font-family:var(--font-mono);font-size:11px;letter-spacing:1px;
    text-decoration:underline;
  }
  .subtitulo-tela{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:26px;
  }
  .campo{margin-bottom:18px;}
  .campo label{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .campo input, .campo textarea, .campo select{
    width:100%;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px;
    padding:14px;
    border-radius:8px;
    outline:none;
  }
  .campo select{appearance:none;-webkit-appearance:none;}
  .campo input:focus, .campo textarea:focus, .campo select:focus{border-color:var(--amber);}
  .campo textarea{resize:none;min-height:60px;}
  .campo.obrigatorio-1301 textarea, .campo.obrigatorio-1301 select, .campo.obrigatorio-1301 input{border-color:var(--amber);}
  .campo.obrigatorio-1301 label{color:var(--amber);}
  .aviso-pj{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--amber);
    margin-top:6px;
    letter-spacing:0.5px;
  }
  .pj-tipo-selector{display:flex;gap:10px;}
  .pj-tipo-btn{
    flex:1;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    padding:14px;
    border-radius:8px;
  }
  .pj-tipo-btn.selecionado{border-color:var(--amber);color:var(--amber);background:var(--bg-elev);}
  .pj-descricao-auto{
    margin-top:10px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    color:var(--text);
    line-height:1.4;
  }
  .pj-descricao-auto.buscando{color:var(--text-dim);font-family:var(--font-mono);font-size:11px;letter-spacing:0.5px;}
  .pj-valor-auto{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--amber);
    margin-top:6px;
  }
  .pj-descricao-erro{
    margin-top:8px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--red);
  }
  .btn-primario{
    background:var(--red);
    color:#fff;
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    font-size:16px;
    letter-spacing:0.5px;
    padding:17px;
    border-radius:8px;
    margin-top:8px;
  }
  .btn-primario:active{background:var(--red-dim);}
  .btn-primario:disabled{background:var(--bg-elev);color:var(--text-dim);}
  .erro-form{
    color:var(--red);
    font-family:var(--font-mono);
    font-size:12px;
    margin-top:10px;
    text-align:center;
    min-height:16px;
  }

  /* ---------- LISTA DE ATIVOS ---------- */
  #tela-lista{gap:0;}
  .lista-vazia{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:8px;
  }
  .lista-vazia .icone-vazio{font-size:38px;margin-bottom:4px;opacity:0.4;}
  .lista-vazia p{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
  .lista-ativos{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:20px;
  }
  .card-ativo{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
  }
  .card-ativo .card-topo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .status-pill{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:1.5px;
    padding:5px 12px;
    border-radius:20px;
    text-transform:uppercase;
    border:1px solid var(--green);
    color:var(--green);
  }
  .status-pill.pausado{border-color:var(--amber);color:var(--amber);}
  .card-ativo .cronometro{
    font-family:var(--font-mono);
    font-size:26px;
    font-weight:600;
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  .card-ativo .cronometro.pausado-txt{color:var(--amber);}
  .card-info{
    width:100%;
    margin-bottom:16px;
  }
  .card-info .linha{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .card-info .linha:last-child{border-bottom:none;}
  .card-info .linha span:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .card-info .linha span:last-child{font-weight:600;text-align:right;}
  .card-info .linha.pj span:last-child{color:var(--amber);}
  .acoes-card{width:100%;display:flex;gap:10px;}
  .btn-pausar{
    flex:1;
    background:var(--bg-elev);
    border:1px solid var(--amber-dim);
    color:var(--amber);
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    padding:14px;
    border-radius:8px;
  }
  .btn-pausar.retomar{border-color:var(--green);color:var(--green);}
  .btn-encerrar{
    flex:1;
    background:var(--red);
    border:none;
    color:#fff;
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    padding:14px;
    border-radius:8px;
  }
  .btn-novo-flutuante{
    width:100%;
    background:var(--bg-elev);
    border:1px dashed var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    padding:16px;
    border-radius:10px;
    margin-top:auto;
  }

  /* ---------- MODAIS ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .overlay.active{display:flex;}
  .modal{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:26px 22px;
    width:100%;
    max-width:340px;
    max-height:92vh;
    overflow:auto;
  }
  .modal h3{
    font-family:var(--font-display);
    font-size:19px;
    margin-bottom:6px;
  }
  .modal p{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:20px;
    letter-spacing:0.5px;
    line-height:1.6;
  }
  .modal-acoes{display:flex;gap:10px;}
  .modal-acoes button{flex:1;padding:14px;border-radius:8px;font-family:var(--font-body);font-weight:700;font-size:14px;}
  .btn-cancelar{background:none;border:1px solid var(--border);color:var(--text-dim);}
  .btn-confirmar{background:var(--red);border:none;color:#fff;}
  .btn-confirmar.amber{background:var(--amber);color:#1a1a1a;}
  .btn-confirmar.verde{background:var(--green);}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(18,18,18,0.85);
    display:none;align-items:center;justify-content:center;z-index:20;
    font-family:var(--font-mono);color:var(--text-dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;
  }
  .loading-overlay.active{display:flex;}

  .aviso-excedido{
    background:rgba(198,40,40,0.15);border:1px solid var(--red);color:#ff8a80;
    font-family:var(--font-mono);font-size:12px;line-height:1.5;
    padding:12px 14px;border-radius:8px;margin-bottom:14px;
  }
  .banner-fila{
    background:rgba(230,162,60,0.12);border-bottom:1px solid var(--amber-dim);color:var(--amber);
    font-family:var(--font-mono);font-size:11px;line-height:1.5;padding:8px 20px;text-align:center;
  }

  /* ---------- RELATÓRIO ---------- */
  .card-resumo{
    background:var(--bg-panel);
    border:1px solid var(--amber-dim);
    border-radius:10px;
    padding:14px 16px;
  }
  .card-resumo .linha{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    font-size:13px;
  }
  .card-resumo .linha span:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .card-resumo .linha span:last-child{font-weight:700;color:var(--amber);}
  .card-relatorio{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .card-relatorio .linha{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:4px 0;
    font-size:13px;
  }
  .card-relatorio .linha span:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
  .card-relatorio .linha span:last-child{font-weight:600;text-align:right;}

  /* ---------- FECHAMENTO MENSAL ---------- */
  .bloco-fechamento{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
  }
  .bloco-fechamento.ok{border-color:var(--green);}
  .bloco-fechamento.atencao{border-color:var(--amber);}
  .bloco-fechamento.erro{border-color:var(--red);}
  .bloco-fechamento .fech-titulo{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    letter-spacing:0.5px;
    margin-bottom:8px;
  }
  .bloco-fechamento .fech-texto{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .bloco-fechamento .fech-aviso{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--amber);
    line-height:1.5;
    margin-top:10px;
  }
  .fech-botoes{display:flex;gap:10px;margin-top:14px;}
  .fech-botoes button{flex:1;padding:14px;border-radius:8px;font-family:var(--font-body);font-weight:700;font-size:14px;}
  .btn-aprovar-mes{background:var(--green);border:none;color:#fff;}
  .btn-contestar-mes{background:none;border:1px solid var(--red-dim);color:#ec8a80;}
  .aprovar-resumo{
    background:var(--bg-elev);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:14px;
    font-size:13px;
  }
  .aprovar-resumo .linha{display:flex;justify-content:space-between;padding:3px 0;}
  .aprovar-resumo .linha span:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;}
  .aprovar-resumo .linha span:last-child{font-weight:700;}
  .aviso-libera{
    background:rgba(230,162,60,0.12);
    border:1px solid var(--amber-dim);
    color:var(--amber);
    border-radius:8px;
    padding:12px;
    font-size:13px;
    line-height:1.5;
    margin-bottom:14px;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="m">MORENO<span>·</span>FUNDIÇÃO</div>
      <div class="sub">Apontamento</div>
    </div>
    <div id="header-op" style="display:none;">
      <div class="op-tag"><b id="header-nome"></b>Crachá <span id="header-cracha"></span></div>
      <div class="header-botoes">
        <button class="logout-btn" onclick="abrirRelatorio()">RELATÓRIO</button>
        <button class="logout-btn" onclick="sair()">SAIR</button>
      </div>
    </div>
  </header>
  <div id="banner-fila" class="banner-fila" style="display:none;"></div>

  <main>

    <!-- LOGIN -->
    <section id="tela-login" class="screen active">
      <div class="logo-grande">MORENO<span>·</span>FUNDIÇÃO</div>
      <div class="login-hint">Informe seu crachá</div>
      <div id="cracha-display" class="vazio">— — — —</div>
      <div class="keypad">
        <button onclick="digitar('1')">1</button>
        <button onclick="digitar('2')">2</button>
        <button onclick="digitar('3')">3</button>
        <button onclick="digitar('4')">4</button>
        <button onclick="digitar('5')">5</button>
        <button onclick="digitar('6')">6</button>
        <button onclick="digitar('7')">7</button>
        <button onclick="digitar('8')">8</button>
        <button onclick="digitar('9')">9</button>
        <button class="apagar" onclick="apagar()">APAGAR</button>
        <button onclick="digitar('0')">0</button>
        <button class="entrar" onclick="entrar()">ENTRAR</button>
      </div>
      <label class="lembrar-linha">
        <input type="checkbox" id="f-lembrar" checked>
        Manter conectado neste celular
      </label>
      <div id="login-erro"></div>
    </section>

    <!-- NOVO APONTAMENTO -->
    <section id="tela-novo" class="screen">
      <div class="topo-tela">
        <div class="titulo-tela">Novo apontamento</div>
        <button class="link-voltar" id="btn-voltar-lista" onclick="mostrarTela('tela-lista')" style="display:none;">VER ATIVOS</button>
      </div>
      <div class="subtitulo-tela">Preencha os dados do serviço</div>

      <div class="campo">
        <label>Ordem</label>
        <input type="text" id="f-ordem" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="campo">
        <label>Operação (OP)</label>
        <input type="text" id="f-op" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="campo">
        <label>Centro de Trabalho</label>
        <input type="text" id="f-centro" list="lista-centros" autocomplete="off" placeholder="Digite o código e escolha da lista">
        <datalist id="lista-centros"></datalist>
        <div class="aviso-pj" id="centro-info" style="display:none;"></div>
      </div>

      <div class="campo">
        <label>PJ</label>
        <div class="pj-tipo-selector">
          <button type="button" class="pj-tipo-btn" id="btn-pj-ae" onclick="selecionarTipoPj('AE')">AE</button>
          <button type="button" class="pj-tipo-btn" id="btn-pj-vi" onclick="selecionarTipoPj('VI')">VI</button>
        </div>
      </div>
      <div class="campo" id="campo-pj-numero" style="display:none;">
        <label>Número do PJ</label>
